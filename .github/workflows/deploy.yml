name: Deploy to Netlify

# NOTE: push trigger removed 2026-06-25. Deploys now run locally from
# scripts/yt2pod.sh (the Mac's netlify CLI is authenticated). This Action's
# NETLIFY_AUTH_TOKEN secret kept expiring and emailed failures on every push.
# Kept as a manual fallback only — rotate the secret before using it.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy \
            --prod \
            --dir public \
            --no-build \
            --message "feed update: ${{ github.event.head_commit.message }}"
